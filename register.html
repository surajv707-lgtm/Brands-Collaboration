<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | For Collab - Creator & Brand Platform</title>

    <meta name="description" content="Register on For Collab to connect with brands and creators for professional influencer marketing collaborations.">
    <meta name="keywords" content="For Collab register, influencer signup, brand collaboration registration">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="register.css">
</head>
<body>

<header>
    <div class="logo">For Collab</div>
    <div class="back-btn" onclick="goBack()">&#8592;</div>
</header>

<section class="register-section">
    <div class="register-box">

        <h1>Create Your Account</h1>

        <form onsubmit="return validateForm()">

    <label>Full Name</label>
    <input type="text" required>

    <label>Email Address</label>
    <input type="email" required>

    <label>Phone Number</label>
    <input type="tel" required>

    <label>Password</label>
    <input type="password" id="password" required minlength="6">
    <input type="checkbox" onclick="togglePassword()"> Show Password
   
    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" required minlength="6">
    <input type="checkbox" onclick="togglePassword()"> Show Password
            
    <label id="captchaQuestion"></label>
    <input type="text" id="captchaInput" placeholder="Enter CAPTCHA Answer" required>

    <button type="submit" class="register-btn">Register</button>

        </form>

        <p id="message"></p>

    </div>
</section>

<footer>
    <p>© 2026 For Collab. All Rights Reserved.</p>
</footer>

<script>
let num1, num2, correctAnswer;

function goBack() {
    window.location.href 
        = "index.html";
}

function generateCaptcha() {
    num1 = Math.floor(Math.random() * 10) + 1;
    num2 = Math.floor(Math.random() * 10) + 1;
    correctAnswer = num1 + num2;

    document.getElementById("captchaQuestion").innerText =
        "CAPTCHA: What is " + num1 + " + " + num2 + " ?";
}

function validateForm() {

    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;
    let userAnswer = document.getElementById("captchaInput").value;

    if(password.length < 6) {
        alert("Password must be at least 6 characters.");
        return false;
    }

    if(password !== confirmPassword) {
        alert("Passwords do not match.");
        return false;
    }



function togglePassword() {
    let pass = document.getElementById("password");
    let confirmPass = document.getElementById("confirmPassword");

    if(pass.type === "password") {
        pass.type = "text";
        confirmPass.type = "text";
    } else {
        pass.type = "password";
        confirmPass.type = "password";
    }
}


    

    if(userAnswer != correctAnswer) {
        alert("Incorrect CAPTCHA. Try again.");
        generateCaptcha();
        return false;
    }

    localStorage.setItem("userLoggedIn", "true");
    alert("Registration Successful!");
    window.location.href = "index.html";
    return false;
}

generateCaptcha();
</script>

</body>
</html>
