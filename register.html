<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <header>
  <div class="logo">BrandCollab</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html" id="loginLink">Login</a>
    <a href="register.html" id="registerLink">Register</a>
    <a href="#" id="logoutLink" style="display:none;" onclick="logout()">Logout</a>
  </nav>
    </header>

    
<section class="form-section">
    <h1>REGISTER</h1>
    <form onsubmit="register(event)">
    <input type="text" placeholder="Full Name" required>
    <input type="email" id="regEmail" placeholder="Email" required>
    <input type="password" id="regPassword" placeholder="Password" required>
    <button type="submit">Register</button>
    </form>
</section>
    
<script>
function register(e){
    e.preventDefault();

    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;

    localStorage.setItem("registeredEmail", email);
    localStorage.setItem("registeredPassword", password);

    alert("Registration Successful! Please Login.");
    window.location.href="login.html";
}
</script>

    
    <script>
function updateNavbar(){
    const loggedIn = localStorage.getItem("isLoggedIn") === "true";
    document.getElementById("loginLink").style.display = loggedIn ? "none" : "inline";
    document.getElementById("registerLink").style.display = loggedIn ? "none" : "inline";
    document.getElementById("logoutLink").style.display = loggedIn ? "inline" : "none";
}

function logout(){
    localStorage.removeItem("isLoggedIn");
    window.location.href = "index.html";
}

window.onload = updateNavbar;
    </script>

</body>
</html>
