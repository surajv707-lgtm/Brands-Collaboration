<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register | For Collab</title>
    <link rel="stylesheet" href="register.css">
    <style>
        /* Styling for the show password toggle */
        .password-container {
            position: relative;
            width: 100%;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #D4AF37;
            user-select: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <nav class="auth-nav">
        <div class="logo">For Collab</div>
        <a href="index.html" class="back-btn">Back  ⬅</a>
    </nav>

    <div class="auth-container">
        <form id="regForm" class="auth-form">
            <h2>Create Account</h2>
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            
            <div class="password-container">
                <input type="password" id="pass" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>
            
            <div class="captcha-box">
                <span id="captchaTxt"></span>
                <input type="text" id="captchaIn" placeholder="Captcha" required>
            </div>
            
            <button type="submit" class="btn">Register Now</button>
            <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

    <script>
        const code = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('captchaTxt').innerText = code;

        // Toggle Password Visibility
        function togglePassword() {
            const passInput = document.getElementById('pass');
            const toggleIcon = document.querySelector('.toggle-password');
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleIcon.innerText = "🙈";
            } else {
                passInput.type = "password";
                toggleIcon.innerText = "👁️";
            }
        }

        document.getElementById('regForm').onsubmit = function(e) {
            e.preventDefault();
            if(document.getElementById('captchaIn').value.toUpperCase() !== code) return alert("Wrong Captcha");

            let users = JSON.parse(localStorage.getItem('users') || "[]");
            let email = document.getElementById('email').value;

            if(users.find(u => u.email === email)) {
                return alert("Email already registered!");
            }

            users.push({
                name: document.getElementById('name').value,
                email: email,
                pass: document.getElementById('pass').value
            });

            localStorage.setItem('users', JSON.stringify(users));

            // Professional Centered Success Message
            const successMsg = document.createElement('div');
            successMsg.innerText = "Registration Successful!";
            
            Object.assign(successMsg.style, {
                position: 'fixed',
                top: '50%',
                left: '50%',
                transform: 'translate(-50%, -50%)',
                background: 'linear-gradient(135deg, #0f3e28, #18603e)', /* Trust/Professional emerald texture */
                color: '#ffffff',
                padding: '20px 40px',
                borderRadius: '8px',
                boxShadow: '0 8px 20px rgba(0,0,0,0.6)',
                border: '1px solid #D4AF37', /* Gold luxury border */
                fontFamily: 'Arial, sans-serif',
                fontWeight: 'bold',
                fontSize: '1.2rem',
                letterSpacing: '1px',
                zIndex: '9999',
                textAlign: 'center',
                opacity: '0',
                transition: 'opacity 0.4s ease-in-out'
            });
            
            document.body.appendChild(successMsg);
            
            // Fade in
            setTimeout(() => { successMsg.style.opacity = '1'; }, 10);

            // Wait 2 seconds, then redirect
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        };
    </script>
</body>
</html>
