<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | For Collab - Creator & Brand Platform</title>

    <meta name="description" content="Register on For Collab to connect with brands and creators for professional influencer marketing collaborations.">
    <meta name="keywords" content="For Collab register, influencer signup, brand collaboration registration">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="register.css">
</head>
<body>

<header>
    <div class="logo">For Collab</div>

    <div class="back-btn" onclick="goBack()">&#8592;</div>
</header>

<section class="register-section">
    <div class="register-box">

        <h1>Create Your Account</h1>

        <form onsubmit="return verifyOTP()">

            <label>Full Name</label>
            <input type="text" id="name" required>

            <label>Email Address</label>
            <input type="email" id="email" required>

            <label>Phone Number</label>
            <input type="tel" id="phone" required>

            <button type="button" onclick="sendOTP()" class="otp-btn">Send OTP</button>

            <label>Enter OTP</label>
            <input type="text" id="otp" required>

            <button type="submit" class="register-btn">Register</button>

        </form>

        <p id="message"></p>

    </div>
</section>

<footer>
    <p>© 2026 For Collab. All Rights Reserved.</p>
</footer>

<script>
let generatedOTP;

function goBack() {
    window.location.href = "index.html";
}

function sendOTP() {
    generatedOTP = Math.floor(100000 + Math.random() * 900000);
    alert("Demo OTP: " + generatedOTP); 
    document.getElementById("message").innerText = "OTP sent successfully (Demo Mode)";
}

function verifyOTP() {
    let enteredOTP = document.getElementById("otp").value;

    if(enteredOTP == generatedOTP) {
        localStorage.setItem("userLoggedIn", "true");
        alert("Registration Successful!");
        window.location.href = "index.html";
        return false;
    } else {
        alert("Invalid OTP. Please try again.");
        return false;
    }
}
</script>

</body>
</html>
