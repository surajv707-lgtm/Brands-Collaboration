<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register | For Collab</title>
    <link rel="stylesheet" href="register.css">
    <style>
        .password-container {
            position: relative;
            width: 100%;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #D4AF37;
            user-select: none;
            z-index: 10;
        }
        /* Style for the two points */
        .password-requirements {
            text-align: left;
            font-size: 0.85rem;
            margin: 5px 0 15px 5px;
            color: #ccc;
        }
        .requirement-item {
            display: block;
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }
        /* Class for when requirements are met */
        .met {
            color: #2ecc71 !important; /* Premium Green */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="auth-nav">
        <div class="logo">For Collab</div>
        <a href="index.html" class="back-btn">Back  ⬅</a>
    </nav>

    <div class="auth-container">
        <form id="regForm" class="auth-form">
            <h2>Create Account</h2>
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            
            <div class="password-container">
                <input type="password" id="pass" placeholder="Password" required oninput="validatePassword()">
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>

            <div class="password-requirements" id="passReqs">
                <span id="reqLen" class="requirement-item">• (minimum 10 character required)</span>
                <span id="reqNum" class="requirement-item">• (minimum 4 number required)</span>
            </div>
            
            <div class="captcha-box">
                <span id="captchaTxt"></span>
                <input type="text" id="captchaIn" placeholder="Captcha" required>
            </div>
            
            <button type="submit" id="regBtn" class="btn" disabled>Register Now</button>
            <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

    <script>
        const code = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('captchaTxt').innerText = code;

        function validatePassword() {
            const pass = document.getElementById('pass').value;
            const reqLen = document.getElementById('reqLen');
            const reqNum = document.getElementById('reqNum');
            const regBtn = document.getElementById('regBtn');

            // Requirement 1: 10 characters
            const isLongEnough = pass.length >= 10;
            if (isLongEnough) {
                reqLen.innerHTML = "✅ (minimum 10 character required)";
                reqLen.classList.add('met');
            } else {
                reqLen.innerHTML = "• (minimum 10 character required)";
                reqLen.classList.remove('met');
            }

            // Requirement 2: 4 numbers
            const numCount = (pass.match(/\d/g) || []).length;
            const hasFourNums = numCount >= 4;
            if (hasFourNums) {
                reqNum.innerHTML = "✅ (minimum 4 number required)";
                reqNum.classList.add('met');
            } else {
                reqNum.innerHTML = "• (minimum 4 number required)";
                reqNum.classList.remove('met');
            }

            // Button activation
            regBtn.disabled = !(isLongEnough && hasFourNums);
        }

        function togglePassword() {
            const passInput = document.getElementById('pass');
            const toggleIcon = document.querySelector('.toggle-password');
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleIcon.innerText = "🙈";
            } else {
                passInput.type = "password";
                toggleIcon.innerText = "👁️";
            }
        }

        function showMessage(text, type) {
            const msg = document.createElement('div');
            msg.innerText = text;
            const baseStyles = {
                position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%, -50%)',
                color: '#ffffff', padding: '20px 40px', borderRadius: '8px',
                boxShadow: '0 8px 20px rgba(0,0,0,0.6)', fontFamily: 'Arial, sans-serif',
                fontWeight: 'bold', fontSize: '1.2rem', zIndex: '9999', textAlign: 'center',
                opacity: '0', transition: 'opacity 0.4s ease-in-out'
            };

            if (type === 'success' || type === 'info') {
                Object.assign(baseStyles, { background: 'linear-gradient(135deg, #0f3e28, #18603e)', border: '1px solid #D4AF37' });
            } else if (type === 'error') {
                Object.assign(baseStyles, { background: 'linear-gradient(135deg, #8b0000, #b22222)', border: '1px solid #ff4d4d' });
            }
            
            Object.assign(msg.style, baseStyles);
            document.body.appendChild(msg);
            setTimeout(() => { msg.style.opacity = '1'; }, 10);
            setTimeout(() => {
                msg.style.opacity = '0';
                setTimeout(() => msg.remove(), 400);
            }, 2500);
        }

        document.getElementById('regForm').onsubmit = function(e) {
            e.preventDefault();
            if(document.getElementById('captchaIn').value.toUpperCase() !== code) {
                showMessage("Error! Captcha", "error");
                return;
            }
            let users = JSON.parse(localStorage.getItem('users') || "[]");
            let email = document.getElementById('email').value;
            if(users.find(u => u.email === email)) {
                showMessage("Email already registered", "info");
                return;
            }
            users.push({
                name: document.getElementById('name').value,
                email: email,
                pass: document.getElementById('pass').value
            });
            localStorage.setItem('users', JSON.stringify(users));
            showMessage("Registration Successful!", "success");
            setTimeout(() => { window.location.href = "login.html"; }, 2000);
        };
    </script>
</body>
</html>
