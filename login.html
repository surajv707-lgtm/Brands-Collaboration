<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | For Collab - Exclusive Creator Network</title>
    <meta name="description" content="Secure login for For Collab members. Access your luxury collaboration dashboard.">
    <link rel="stylesheet" href="login.css">
    <style>
        /* Styling for the show password toggle */
        .password-container {
            position: relative;
            width: 100%;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #D4AF37;
            user-select: none;
        }
    </style>
</head>
<body>
    <nav class="auth-nav">
        <div class="logo">For Collab</div>
        <a href="index.html" class="back-btn">Back ⬅ </a>
    </nav>

    <main class="auth-container">
        <form id="loginForm" class="auth-form">
            <h2>Luxury Login</h2>
            <input type="email" id="lEmail" placeholder="Email Address" required>
            
            <div class="password-container">
                <input type="password" id="lPass" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>
            
            <div class="captcha-box">
                <span id="lCapTxt"></span>
                <input type="text" id="lCapIn" placeholder="Enter Captcha" required>
            </div>
            
            <button type="submit" class="btn">Login</button>
            <p>New here? <a href="register.html" style="color: #D4AF37; text-decoration: none;">Register</a></p>
        </form>
    </main>

    <script>
        // Generate Captcha
        const code = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('lCapTxt').innerText = code;

        // Toggle Password Visibility
        function togglePassword() {
            const passInput = document.getElementById('lPass');
            const toggleIcon = document.querySelector('.toggle-password');
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleIcon.innerText = "🙈";
            } else {
                passInput.type = "password";
                toggleIcon.innerText = "👁️";
            }
        }

        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            
            const enteredCaptcha = document.getElementById('lCapIn').value.toUpperCase();
            if(enteredCaptcha !== code) {
                return alert("Incorrect Captcha. Please try again.");
            }

            let users = JSON.parse(localStorage.getItem('users') || "[]");
            let email = document.getElementById('lEmail').value.trim();
            let pass = document.getElementById('lPass').value;

            // Find user based only on email and password
            let user = users.find(u => u.email === email && u.pass === pass);

            if(user) {
                localStorage.setItem('userLoggedIn', 'true');
                alert("Welcome back, " + user.name);
                window.location.href = "index.html";
            } else {
                alert("Invalid Credentials or User Not Registered!");
            }
        };
    </script>
</body>
</html>
