<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Control | For Collab</title>
    <link rel="stylesheet" href="login.css">
    <style>
        /* Shared Luxury Styles for One-Page Logic */
        .password-container { position: relative; width: 100%; }
        .toggle-password {
            position: absolute; right: 10px; top: 50%;
            transform: translateY(-50%); cursor: pointer;
            color: #D4AF37; user-select: none;
        }
        .hidden { display: none; }
        .input-group { position: relative; display: flex; align-items: center; width: 100%; }
        .verify-btn { 
            position: absolute; right: 10px; background: #D4AF37; 
            border: none; padding: 5px 12px; cursor: pointer; 
            font-weight: bold; font-size: 0.7rem; color: black;
            border-radius: 2px;
        }
        .status-icon { position: absolute; right: 12px; display: none; font-size: 1rem; }
        .btn:disabled { background: #444; cursor: not-allowed; color: #777; border: none; opacity: 0.6; }
        .flex-btns { display: flex; gap: 10px; margin-top: 20px; width: 100%; }
        .flex-btns .btn { margin-top: 0; }

        /* Real-time Requirement Styles */
        .password-requirements {
            text-align: left;
            font-size: 0.85rem;
            margin: 5px 0 15px 5px;
            color: #ccc;
        }
        .requirement-item {
            display: block;
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }
        .met {
            color: #2ecc71 !important;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="auth-nav">
        <div class="logo">For Collab</div>
        <a href="index.html" class="back-btn">Back ⬅ </a>
    </nav>

    <main class="auth-container">
        <form id="loginForm" class="auth-form">
            <h2>Login</h2>
            <input type="email" id="lEmail" placeholder="Email Address" required>
            <div class="password-container">
                <input type="password" id="lPass" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword('lPass', this)">👁️</span>
            </div>
            <div style="text-align: right; margin: 5px 0 15px 0;">
                <a href="#" onclick="showSection('verifySection')" style="color: #D4AF37; font-size: 0.8rem; text-decoration: none;">Forgot Password?</a>
            </div>
            <div class="captcha-box">
                <span id="lCapTxt"></span>
                <input type="text" id="lCapIn" placeholder="Enter Captcha" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <p style="margin-top: 15px;">New here? <a href="register.html" style="color: #D4AF37; text-decoration: none;">Register</a></p>
        </form>

        <div id="verifySection" class="auth-form hidden">
            <h2>Verify Email</h2>
            <p style="margin-bottom: 20px; font-size: 0.9rem; color: #ccc;">Enter your registered email.</p>
            <div class="input-group">
                <input type="email" id="resetEmail" placeholder="Email Address" oninput="resetVerification()">
                <button type="button" id="vBtn" class="verify-btn" onclick="verifyEmailAction()">Verify</button>
                <span id="wrongIcon" class="status-icon">❌</span>
            </div>
            <div class="flex-btns">
                <button onclick="showSection('loginForm')" class="btn" style="background: transparent; border: 1px solid #D4AF37; color: white;">Back</button>
                <button id="nextBtn" class="btn" onclick="showSection('resetSection')" disabled>Next</button>
            </div>
        </div>

        <form id="resetSection" class="auth-form hidden">
            <h2>New Password</h2>
            <div class="password-container">
                <input type="password" id="nPass" placeholder="New Password" required oninput="validateResetPassword()">
                <span class="toggle-password" onclick="togglePassword('nPass', this)">👁️</span>
            </div>

            <div class="password-requirements" id="passReqs">
                <span id="reqCap" class="requirement-item">• (one capital alphabet)</span>
                <span id="reqLen" class="requirement-item">• (minimum 10 character required)</span>
                <span id="reqNum" class="requirement-item">• (minimum 4 number required)</span>
            </div>

            <div class="password-container">
                <input type="password" id="cPass" placeholder="Confirm Password" required oninput="validateResetPassword()">
                <span class="toggle-password" onclick="togglePassword('cPass', this)">👁️</span>
            </div>
            <button type="submit" id="changePassBtn" class="btn" disabled>Change Password</button>
        </form>
    </main>

    <script>
        let currentResetEmail = "";
        let captchaCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('lCapTxt').innerText = captchaCode;

        function showSection(sectionId) {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('verifySection').classList.add('hidden');
            document.getElementById('resetSection').classList.add('hidden');
            document.getElementById(sectionId).classList.remove('hidden');
        }

        function togglePassword(inputId, el) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                el.innerText = "🙈";
            } else {
                input.type = "password";
                el.innerText = "👁️";
            }
        }

        function showCenterMessage(text, isError) {
            const msg = document.createElement('div');
            msg.innerText = text;
            const styles = {
                position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%, -50%)',
                color: '#ffffff', padding: '20px 40px', borderRadius: '8px',
                boxShadow: '0 8px 20px rgba(0,0,0,0.6)', fontFamily: 'Arial, sans-serif',
                fontWeight: 'bold', fontSize: '1.2rem', zIndex: '9999', textAlign: 'center',
                opacity: '0', transition: 'opacity 0.4s ease-in-out'
            };
            if (isError) {
                styles.background = 'linear-gradient(135deg, #8b0000, #b22222)';
                styles.border = '1px solid #ff4d4d';
            } else {
                styles.background = 'linear-gradient(135deg, #0f3e28, #18603e)';
                styles.border = '1px solid #D4AF37';
            }
            Object.assign(msg.style, styles);
            document.body.appendChild(msg);
            setTimeout(() => { msg.style.opacity = '1'; }, 10);
            if (text !== "Login Successful!" && text !== "Password Changed Successfully!") {
                setTimeout(() => {
                    msg.style.opacity = '0';
                    setTimeout(() => msg.remove(), 400);
                }, 2000);
            }
        }

        function validateResetPassword() {
            const nPass = document.getElementById('nPass').value;
            const cPass = document.getElementById('cPass').value;
            const reqCap = document.getElementById('reqCap');
            const reqLen = document.getElementById('reqLen');
            const reqNum = document.getElementById('reqNum');
            const changeBtn = document.getElementById('changePassBtn');

            const hasCap = /[A-Z]/.test(nPass);
            const isLong = nPass.length >= 10;
            const hasNums = (nPass.match(/\d/g) || []).length >= 4;

            reqCap.innerHTML = hasCap ? "✅ (one capital alphabet)" : "• (one capital alphabet)";
            hasCap ? reqCap.classList.add('met') : reqCap.classList.remove('met');

            reqLen.innerHTML = isLong ? "✅ (minimum 10 character required)" : "• (minimum 10 character required)";
            isLong ? reqLen.classList.add('met') : reqLen.classList.remove('met');

            reqNum.innerHTML = hasNums ? "✅ (minimum 4 number required)" : "• (minimum 4 number required)";
            hasNums ? reqNum.classList.add('met') : reqNum.classList.remove('met');

            // Button active if typed in both and requirements met
            changeBtn.disabled = !(hasCap && isLong && hasNums && cPass.length > 0);
        }

        // Login Submit
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            if(document.getElementById('lCapIn').value.toUpperCase() !== captchaCode) {
                showCenterMessage("Error! Captcha", true);
                return;
            }
            let users = JSON.parse(localStorage.getItem('users') || "[]");
            let email = document.getElementById('lEmail').value.trim();
            let pass = document.getElementById('lPass').value;
            let user = users.find(u => u.email === email);
            if (!user) { showCenterMessage("Email doesn't register", false); }
            else if (user.pass !== pass) { showCenterMessage("Wrong Password", true); }
            else {
                localStorage.setItem('userLoggedIn', 'true');
                showCenterMessage("Login Successful!", false);
                setTimeout(() => { window.location.href = "index.html"; }, 2500);
            }
        };

        function resetVerification() {
            document.getElementById('vBtn').style.display = 'block';
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('wrongIcon').style.display = 'none';
        }

        function verifyEmailAction() {
            const email = document.getElementById('resetEmail').value.trim();
            const users = JSON.parse(localStorage.getItem('users') || "[]");
            if (users.find(u => u.email === email)) {
                currentResetEmail = email;
                document.getElementById('vBtn').style.display = 'none';
                document.getElementById('nextBtn').disabled = false;
            } else {
                document.getElementById('wrongIcon').style.display = 'block';
            }
        }

        document.getElementById('resetSection').onsubmit = function(e) {
            e.preventDefault();
            const nPass = document.getElementById('nPass').value;
            const cPass = document.getElementById('cPass').value;
            if (nPass !== cPass) {
                showCenterMessage("Password doesn't matched", true);
                return;
            }
            let users = JSON.parse(localStorage.getItem('users') || "[]");
            let idx = users.findIndex(u => u.email === currentResetEmail);
            if (idx !== -1) {
                users[idx].pass = nPass;
                localStorage.setItem('users', JSON.stringify(users));
                showCenterMessage("Password Changed Successfully!", false);
                setTimeout(() => { window.location.reload(); }, 2500);
            }
        };
    </script>
</body>
</html>
