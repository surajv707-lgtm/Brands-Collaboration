<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | For Collab</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <nav class="auth-nav">
        <a href="index.html" class="back-btn">← Back</a>
        <div class="logo">For Collab</div>
    </nav>

    <div class="auth-container">
        <form id="loginForm" class="auth-form">
            <h2>Luxury Login</h2>
            <input type="text" id="lName" placeholder="Name" required>
            <input type="email" id="lEmail" placeholder="Email Address" required>
            <input type="password" id="lPass" placeholder="Password" required>
            <div class="captcha-box">
                <span id="lCapTxt"></span>
                <input type="text" id="lCapIn" placeholder="Captcha" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <p>New here? <a href="register.html">Register</a></p>
        </form>
    </div>

    <script>
        const code = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('lCapTxt').innerText = code;

        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            if(document.getElementById('lCapIn').value !== code) return alert("Wrong Captcha");

            let users = JSON.parse(localStorage.getItem('users') || "[]");
            let email = document.getElementById('lEmail').value;
            let pass = document.getElementById('lPass').value;
            let name = document.getElementById('lName').value;

            let user = users.find(u => u.email === email && u.pass === pass && u.name === name);

            if(user) {
                localStorage.setItem('userLoggedIn', 'true');
                alert("Welcome back, " + name);
                window.location.href = "index.html";
            } else {
                alert("Invalid Credentials or User Not Registered!");
            }
        };
    </script>
</body>
</html>
