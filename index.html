<!DOCTYPE html>
<html>
<head>
    <title>Brand Collaboration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header>
    <div class="logo">BrandCollab</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact Us</a>
        <a href="#" id="loginNav">Login</a>
        <a href="#" id="registerNav">Register</a>
        <a href="#" id="logoutNav" style="display:none;">Logout</a>
    </nav>
</header>

<!-- HOME SECTION -->
<section class="home">
    <div class="overlay">
        <h1>Connect Brands With Top Creators</h1>
        <p>
            Grow your brand through powerful influencer collaborations, 
            strategic campaigns, and trusted creator partnerships.
        </p>

        <div class="buttons">
            <button id="loginBtn">Login</button>
            <button id="registerBtn">Register</button>
            <button id="addCreatorBtn" style="display:none;">Add Creator</button>
        </div>
    </div>
</section>

<!-- Creator Section Anchor -->
<section id="creator"></section>

<script>

const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");
const addCreatorBtn = document.getElementById("addCreatorBtn");

const loginNav = document.getElementById("loginNav");
const registerNav = document.getElementById("registerNav");
const logoutNav = document.getElementById("logoutNav");

function loginUser() {
    loginBtn.style.display = "none";
    registerBtn.style.display = "none";
    loginNav.style.display = "none";
    registerNav.style.display = "none";

    addCreatorBtn.style.display = "inline-block";
    logoutNav.style.display = "inline-block";
}

function logoutUser() {
    loginBtn.style.display = "inline-block";
    registerBtn.style.display = "inline-block";
    loginNav.style.display = "inline-block";
    registerNav.style.display = "inline-block";

    addCreatorBtn.style.display = "none";
    logoutNav.style.display = "none";
}

loginBtn.onclick = loginUser;
registerBtn.onclick = loginUser;
loginNav.onclick = loginUser;
registerNav.onclick = loginUser;
logoutNav.onclick = logoutUser;

addCreatorBtn.onclick = function() {
    document.getElementById("creator").scrollIntoView({behavior: "smooth"});
}

</script>

</body>
</html>
