<!DOCTYPE html>
<html>
<head>
    <title>Contact - Brand Collaboration</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

<header>
  <div class="logo">BrandCollab</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html" id="loginLink">Login</a>
    <a href="register.html" id="registerLink">Register</a>
    <a href="#" id="logoutLink" style="display:none;" onclick="logout()">Logout</a>
  </nav>
</header>

<section class="contact-section">
<section class="contact-section">
  <h1>CONTACT US</h1>
  <!-- modify this form HTML and place wherever you want your form -->
<form
  action="https://formspree.io/f/mwvnzdqq"
  method="POST"
>
  <label>
    Your email:
    <input type="email" name="email">
  </label>
  <label>
    Your message:
    <textarea name="message"></textarea>
  </label>
  <!-- your other form fields go here -->
  <button type="submit">Send</button>
</form>
</section>
    
<script>
function updateNavbar(){
    const loggedIn = localStorage.getItem("isLoggedIn") === "true";
    document.getElementById("loginLink").style.display = loggedIn ? "none" : "inline";
    document.getElementById("registerLink").style.display = loggedIn ? "none" : "inline";
    document.getElementById("logoutLink").style.display = loggedIn ? "inline" : "none";
}

function logout(){
    localStorage.removeItem("isLoggedIn");
    window.location.href = "index.html";
}

window.onload = updateNavbar;
</script>
    
</body>
</html>
