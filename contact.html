<!DOCTYPE html>
<html>
<head>
    <title>Contact - Brand Collaboration</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

<header>
    <div class="logo">BrandCollab</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact Us</a>
        <a href="login.html" id="loginLink">Login</a>
        <a href="register.html" id="registerLink">Register</a>
        <a href="#" id="logoutLink" style="display:none;" onclick="logout()">Logout</a>
    </nav>
</header>

<section class="contact-section">
    <h1>CONTACT US</h1>

    <form action="https://formsubmit.co/abhinavvishwakarma36@gmail.com" method="POST">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your Message" required></textarea>

        <input type="hidden" name="_next" value="https://yourwebsite.com/thankyou.html">

        <button type="submit">Send Message</button>
    </form>
</section>
    
<script>
function updateNavbar(){
    if(localStorage.getItem("isLoggedIn")==="true"){
        document.getElementById("loginLink").style.display="none";
        document.getElementById("registerLink").style.display="none";
        document.getElementById("logoutLink").style.display="inline";
    }
}

function logout(){
    localStorage.removeItem("isLoggedIn");
    window.location.href="index.html";
}

window.onload = updateNavbar;
</script>
    
</body>
</html>
