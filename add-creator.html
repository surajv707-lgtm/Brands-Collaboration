<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Application | For Collab</title>
    <meta name="description" content="Join For Collab's elite network of creators.">
    <link rel="stylesheet" href="add-creator.css">
</head>
<body>
    <nav class="auth-nav">
        <div class="logo">For Collab</div>
    </nav>

    <main class="form-wrapper">
        <div class="form-container">
            <header class="form-header">
                <h1>Creator Application</h1>
                <p>Fill out the form below to join our network.</p>
            </header>

            <form action="https://formspree.io/f/xdalrajo" method="POST" id="addCreatorForm" class="professional-form">
                
                <div class="form-section">
                    <h3>Personal Details</h3>
                    <input type="text" name="Name" placeholder="Full Name" required>
                    <input type="email" name="Email" placeholder="Email Address" required>
                    <input type="tel" name="Phone" placeholder="Phone Number" required>
                </div>

                <div class="form-section">
                    <h3>Social Profiles</h3>
                    <input type="text" name="Instagram" placeholder="Instagram ID (e.g., @username)" required>
                    <input type="url" name="YouTube" placeholder="YouTube Channel Link">
                </div>

                <div class="form-section">
                    <h3>Collaboration Details</h3>
                    <input type="text" name="ContentType" placeholder="Content Type (e.g., Fashion, Travel)" required>
                    <input type="text" name="ExpectedPay" placeholder="Expected Money for Promotion (INR)" required>
                    
                    <select name="CollaborationType" required>
                        <option value="" disabled selected>Select Collaboration Type</option>
                        <option value="Brands">Brands</option>
                        <option value="Stores">Stores</option>
                        <option value="Resort">Resort</option>
                        <option value="Restaurant">Restaurant</option>
                        <option value="All Of These">All Of These</option>
                    </select>
                </div>

                <input type="hidden" name="_next" value="https://surajv707-lgtm.github.io/Brands-Collaboration/thank-you.html">

                <div class="button-group">
                    <a href="index.html" class="back-btn-low">Back to Home</a>
                    <button type="submit" class="submit-btn">Submit Application</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
