<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Creator | For Collab</title>
    <meta name="description" content="Submit your creator profile to For Collab.">
    <link rel="stylesheet" href="add-creator.css">
</head>
<body>
    <nav class="auth-nav">
        <div class="logo">For Collab</div>
        </nav>

    <main class="form-wrapper">
        <div class="form-container">
            <header class="form-header">
                <h1>Creator Application</h1>
                <p id="statusMsg">Register your profile for high-tier brand collaborations.</p>
            </header>

            <form id="addCreatorForm" class="professional-form">
                <div class="form-section">
                    <h3>Contact Information</h3>
                    <input type="text" id="cName" placeholder="Full Name" required>
                    <input type="email" id="cEmail" placeholder="Email Address" required>
                    <input type="tel" id="cPhone" placeholder="Phone Number" required>
                </div>

                <div class="form-section">
                    <h3>Social Handles</h3>
                    <input type="text" id="cInsta" placeholder="Instagram ID" required>
                    <input type="url" id="cYoutube" placeholder="YouTube Channel Link">
                </div>

                <div class="form-section">
                    <h3>Content Details</h3>
                    <input type="text" id="cType" placeholder="Content Type" required>
                    <textarea id="cExpect" placeholder="Your Expectations" rows="3" required></textarea>
                </div>

                <div class="form-section">
                    <h3>Collaboration Interest</h3>
                    <select id="collabType" required>
                        <option value="" disabled selected>Select Collaboration Type</option>
                        <option value="Premium Brands">Premium Brands</option>
                        <option value="Luxury Stores">Luxury Stores</option>
                        <option value="Restaurants">Restaurants</option>
                        <option value="Hotels & Resorts">Hotels & Resorts</option>
                        <option value="Electronic Stores">Electronic Stores</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn">Submit Profile</button>
                    <a href="index.html" class="back-btn-low">Back to Home</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('addCreatorForm').onsubmit = function(e) {
            e.preventDefault();
            
            // Collect Values
            const name = document.getElementById('cName').value;
            const email = document.getElementById('cEmail').value;
            const phone = document.getElementById('cPhone').value;
            const insta = document.getElementById('cInsta').value;
            const yt = document.getElementById('cYoutube').value;
            const type = document.getElementById('cType').value;
            const expect = document.getElementById('cExpect').value;
            const collab = document.getElementById('collabType').value;

            // Format WhatsApp Message
            const msg = `*New Creator Application*%0A` +
                        `*Name:* ${name}%0A` +
                        `*Email:* ${email}%0A` +
                        `*Phone:* ${phone}%0A` +
                        `*Instagram:* ${insta}%0A` +
                        `*YouTube:* ${yt}%0A` +
                        `*Content:* ${type}%0A` +
                        `*Expectations:* ${expect}%0A` +
                        `*Collab Interest:* ${collab}`;

            const wpUrl = `https://wa.me/9172660105?text=${msg}`;

            // Show status and redirect
            const status = document.getElementById('statusMsg');
            status.innerHTML = "<b style='color: #D4AF37;'>Submission Completed! Redirecting in 5 seconds...</b>";
            
            // Open WhatsApp in new tab
            window.open(wpUrl, '_blank');

            // Redirect to home after 5 seconds
            setTimeout(() => {
                window.location.href = "index.html";
            }, 5000);
        };
    </script>
</body>
</html>
