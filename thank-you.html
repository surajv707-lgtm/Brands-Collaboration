<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Received | For Collab</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #D4AF37; 
            --deep-emerald: #0f3e28;
            --dark: #050505; 
            --glass: rgba(255, 255, 255, 0.03);
        }

        body { 
            background: radial-gradient(circle at center, #1a1a1a 0%, var(--dark) 100%); 
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Animated background texture */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.pattern');
            opacity: 0.1;
            z-index: -1;
        }

        .container {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 60px 40px;
            max-width: 600px;
            width: 90%;
            border-radius: 4px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
            animation: slideUp 1s ease-out;
        }

        /* The Gold "Seal" of Trust */
        .seal {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 2rem;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        h1 { 
            font-family: 'Playfair Display', serif;
            color: var(--gold); 
            font-size: 2.5rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-style: italic;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: var(--gold);
            margin: 20px auto;
        }

        p { 
            font-size: 1.1rem; 
            line-height: 1.8; 
            color: #cccccc;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(15, 62, 40, 0.4);
            border: 1px solid #18603e;
            color: #88ffc5;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: var(--gold);
            text-decoration: none;
            border: 1px solid var(--gold);
            padding: 12px 35px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-link:hover { 
            background: var(--gold); 
            color: var(--dark); 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            transform: translateY(-3px);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Subtle gold glow in background */
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: var(--gold);
            filter: blur(150px);
            opacity: 0.05;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <div class="status-badge">Secure Submission Verified</div>
        <div class="seal">✓</div>
        <h1>Application Received</h1>
        <div class="divider"></div>
        <p>
            Your credentials have been successfully transmitted to our luxury network. 
            Our curators will review your profile to ensure the perfect brand alignment.
        </p>
        <p style="font-size: 0.9rem; margin-top: 10px; font-style: italic;">
            Expect a response within 24-48 professional hours.
        </p>
        <a href="index.html" class="back-link">Return to Dashboard</a>
    </div>
</body>
</html>
